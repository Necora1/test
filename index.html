<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renn | Void</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  
  <!-- Modular CSS Imports -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/backgrounds.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>
  <canvas id="fogCanvas"></canvas>
  <canvas id="starWarp"></canvas>

  <!-- Navigation Menu -->
  <!-- Expandable Mobile-Friendly Navigation Wrapper -->
  <div class="nav-wrapper">
    <button type="button" id="menuToggleBtn" class="nav-btn glass-pill">
      <span>home</span>
    </button>

    <nav id="mainNav" class="expandable-nav">
      <button type="button" class="nav-btn active-btn" aria-current="page" onclick="showSection('home')"><span>home</span></button>
      <button type="button" class="nav-btn" onclick="showSection('about')"><span>about</span></button>
      <button type="button" class="nav-btn" onclick="showSection('gallery')"><span>gallery</span></button>
      <button type="button" class="nav-btn" onclick="showSection('interests')"><span>interests</span></button>
      <button type="button" class="nav-btn gold-glow" onclick="showSection('send')"><span>send me something</span></button>
      <button type="button" class="nav-btn" onclick="showSection('favoomfs')"><span>favoomfs</span></button>
    </nav>
  </div>

  <!-- Container for the pages -->
  <main class="content-container">
    <section id="home" class="section active">
      <h1>HOME</h1>
      <p>Welcome to the Void.</p>
      <div class="box-placeholder">W.I.P</div>
    </section>

    <section id="about" class="section">
      <h1>ABOUT</h1>
      <p>im renn! This is my website :3</p>
      <div class="box-placeholder">W.I.P</div>
    </section>

    <section id="gallery" class="section">
      <h1>GALLERY</h1>
      <p>Here's the collection of pictures I make</p>
      <script type="text/javascript" src="https://www.juicer.io/embed/xqygen/embed-code.js" async defer></script>
    </section>

    <section id="interests" class="section">
      <h1>INTERESTS</h1>
      <p>Media, hobbies, etc</p>
      <div class="box-placeholder">W.I.P</div>
    </section>

    <section id="send" class="section">
      <h1>SEND ME SOMETHING</h1>
      <p>You can either write or draw</p>

      <div class="message-container">
        <div class="message-input-wrapper">
          <textarea id="messageText" placeholder="Type here" rows="3"></textarea>
          <div class="message-actions">
            <button type="button" id="openSpotifyBtn" title="Attach Spotify Song">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.84.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.72 1.621.539.3.719 1.02.419 1.56-.239.54-.959.72-1.559.3z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="action-btn-container">
        <button type="button" id="sendMessageBtn" class="action-btn">
        <span>SEND ANONYMOUSLY ✍️🤫</span>
      </button>
      </div>

      <div class="drawing-container">
        <div class="drawing-toolbar">
          <button type="button" id="penBtn" class="tool-btn active" title="Pen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
              <path d="m15 5 4 4"/>
            </svg>
          </button>
          <button type="button" id="eraserBtn" class="tool-btn" title="Eraser">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l7 7a1 1 0 0 1 0 1.4L13.7 21"/>
              <path d="M22 21H7"/>
              <path d="m9.5 9.5 5 5"/>
            </svg>
          </button>
          
          <!-- Undo Button (Was Clear All) -->
          <button type="button" id="undoBtn" class="tool-btn" title="Undo Last Stroke">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v6h6"></path>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
          </button>
          
          <!-- Background Toggle Button -->
          <button type="button" id="bgToggleBtn" class="tool-btn text-icon-btn" title="Toggle Canvas Background">
            <span class="bg-label">BG</span>
          </button>
          
          <input type="range" id="brushSize" min="1" max="40" value="4" title="Thickness">
          <input type="color" id="brushColor" value="#ffffff" title="Pick Color">
        </div>
        <canvas id="drawCanvas" width="550" height="350"></canvas>
      </div>

      <div class="action-btn-container last">
        <button type="button" id="sendDrawingBtn" class="action-btn">
        <span>SEND ANONYMOUSLY 🎨🤫</span>
      </button>
      </div>
    </section>
  </main>

  <!-- Spotify Search Modal -->
  <div id="spotifyModal" class="modal-overlay hidden">
    <div class="modal-container">
      <button type="button" id="closeModalBtn" class="modal-close">✖</button>
      <div class="modal-content">
        <div class="search-bar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="songSearch" placeholder="Search for a song...">
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>
  </div>

  <script src="effects.js"></script>
  <script src="navigation.js"></script>
  <script src="messages.js"></script>
</body>
</html>
